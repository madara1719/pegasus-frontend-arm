name: Build ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-declarative-dev \
            qt6-svg-dev qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtquick-templates

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Compilar
        run: cmake --build build -j4

      - name: Empaquetar
        run: |
          mkdir -p artifact
          find build -maxdepth 3 -type f -iname "*pegasus*" -executable -exec cp {} artifact/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: pegasus-frontend-arm64
          path: artifact/
