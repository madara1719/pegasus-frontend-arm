name: Build ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            qtbase5-dev qtdeclarative5-dev qtquickcontrols2-5-dev \
            qml-module-qtquick2 qml-module-qtquick-controls2 \
            qml-module-qtquick-layouts qml-module-qtquick-window2 \
            qml-module-qtgraphicaleffects \
            libqt5svg5-dev

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Compilar
        run: cmake --build build -j4

      - name: Empaquetar
        run: |
          mkdir -p artifact
          find build -maxdepth 3 -type f -iname "*pegasus*" -executable -exec cp {} artifact/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: pegasus-frontend-arm64
          path: artifact/
